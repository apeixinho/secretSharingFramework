spring:
  devtools:
    add-properties: false
  codec:
    max-in-memory-size: 256KB
  # Boot 4: connection settings are spring.mongodb.* (not spring.data.mongodb.*)
  mongodb:
    # Local default uses localhost. Compose overrides via SPRING_MONGODB_URI (host: mongo).
    uri: ${SPRING_MONGODB_URI:mongodb://ss_user:ss_password@localhost:27017/secret_sharing_db?authSource=secret_sharing_db}
  data:
    mongodb:
      auto-index-creation: false

logging:
  level:
    web: WARN
    org.secretsharing: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

secret-sharing:
  asymmetricAlgorithm: RSA
  hashAlgorithm: SHA256withRSA
  keyPairBitSize: 2048
  bitSize: 2048
  maxShares: 60
  cors:
    allowed-origins: http://localhost:4200,http://localhost:4201,http://localhost:4202
  rate-limit:
    recover:
      capacity: 30
      window-seconds: 60
