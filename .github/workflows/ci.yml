name: CI

on:
  push:
    branches: [reactive, reactive-functional, reactive-mongo, main, "age/**"]
  pull_request:
    branches: [reactive, reactive-functional, reactive-mongo, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Make wrapper executable
        run: chmod +x mvnw
      - name: Verify
        run: ./mvnw -B verify
